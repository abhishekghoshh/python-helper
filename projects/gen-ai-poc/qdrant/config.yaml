# Qdrant configuration — minimal local dev setup

log_level: INFO

service:
  host: 0.0.0.0
  http_port: 6333
  grpc_port: 6334
  max_workers: 4
  max_request_size_mb: 256

storage:
  storage_path: /qdrant/storage
  wal_path: /qdrant/storage/wal
  snapshots_path: /qdrant/storage/snapshots

telemetry_disabled: true
