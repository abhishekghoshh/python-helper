name: genai-poc

services:
  # ------------------------------------------------------------------
  # FastAPI application — the GenAI backend
  # ------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: genai-poc-app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ~/.cache/huggingface:/root/.cache/huggingface
    env_file:
      - .env
    depends_on:
      - qdrant
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Qdrant vector database
  # ------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: genai-poc-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
      - ./qdrant/config.yaml:/config/production.yaml
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Streamlit frontend — talks to the FastAPI backend via REST
  # ------------------------------------------------------------------
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: genai-poc-streamlit
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://app:8000
    depends_on:
      - app
    restart: unless-stopped

  # ------------------------------------------------------------------
  # MkDocs documentation site
  # ------------------------------------------------------------------
  docs:
    build:
      context: .
      dockerfile: dockerfile.docs
    container_name: genai-poc-docs
    ports:
      - "8001:8000"
    volumes:
      - ./docs:/docs/docs
      - ./mkdocs.yml:/docs/mkdocs.yml
    restart: unless-stopped

volumes:
  qdrant_storage:
