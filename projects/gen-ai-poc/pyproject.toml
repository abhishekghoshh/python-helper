[tool.poetry]
name = "genai-poc"
version = "0.1.0"
description = "A hands-on Generative AI POC demonstrating LLMs, embeddings, RAG, and vector databases with Python and FastAPI"
authors = ["GenAI Learning Lab"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
openai = "^1.45.0"
qdrant-client = "^1.7.0"
sentence-transformers = "^3.1.0"
httpx = "^0.27.0"
python-multipart = "^0.0.10"
python-dotenv = "^1.0.0"
scikit-learn = "^1.5.0"
numpy = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"
ruff = "^0.6.0"
requests = "^2.32.0"
streamlit = "^1.38.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.0"
mkdocs-material = "^9.5.0"
mkdocs-mermaid2-plugin = "^1.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
