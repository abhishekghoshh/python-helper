[project]
name = "agentic-ai-poc"
version = "0.1.0"
description = "An hands-on Agentic AI learning POC — building, understanding, and interviewing about AI agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Agentic AI Learning Lab" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "openai>=1.45.0",
  "numpy>=2.0.0",
]

[project.optional-dependencies]
rag = ["sentence-transformers>=3.1.0", "qdrant-client>=1.7.0"]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "httpx>=0.27.0", "ruff>=0.6.0"]
ui = ["streamlit>=1.40.0", "requests>=2.32.0"]
docs = ["mkdocs>=1.6.0", "mkdocs-material>=9.5.0", "mkdocstrings[python]>=0.26.0", "mkdocs-mermaid2-plugin>=1.2.3", "pymdown-extensions>=10.0"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "app"}]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]