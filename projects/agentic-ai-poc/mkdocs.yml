site_name: Agentic AI POC
site_description: A hands-on learning laboratory for AI agents — theory, implementation, experiments, and interview preparation
repo_url: https://github.com/abhishekghoshh/python-helper
repo_name: python-helper (agentic-ai-poc)
docs_dir: docs
site_dir: site

nav:
  - Home: index.md
  - API Reference: api-reference.md
  - Project Analysis:
      - Project Analysis: project/project-analysis.md
      - Enhancement Plan: project/enhancement-plan.md
  - Agentic AI Fundamentals:
      - What is Agentic AI?: agentic-ai/fundamentals.md
      - LLM App vs Agent vs Workflow: agentic-ai/classification.md
  - Components:
      - Agent Architecture: architecture/agent-architecture.md
      - Agent Loop: architecture/agent-loop.md
      - Component Diagrams: architecture/diagrams.md
      - Tool Calling: architecture/tool-calling.md
      - Planning & Reasoning: architecture/planning.md
      - Memory: architecture/memory.md
      - State: architecture/state.md
      - RAG + Agents: architecture/rag-agents.md
      - Multi-Agent: architecture/multi-agent.md
      - Orchestration: architecture/orchestration.md
      - Human-in-the-Loop: architecture/human-in-the-loop.md
      - Guardrails & Security: architecture/security.md
      - Evaluation: architecture/evaluation.md
      - Observability: architecture/observability.md
  - Experiments:
      - Agent Loop: experiments/agent-loop.md
      - Tool Selection: experiments/tool-selection.md
      - Planning Strategies: experiments/planning-strategies.md
      - Memory: experiments/memory.md
      - RAG Agent: experiments/rag-agent.md
      - Multi-Agent: experiments/multi-agent.md
      - Human-in-the-Loop: experiments/human-in-the-loop.md
      - Agent Evaluation: experiments/agent-evaluation.md
  - Interview Preparation:
      - Beginner: interview-preparation/beginner.md
      - Intermediate: interview-preparation/intermediate.md
      - Advanced: interview-preparation/advanced.md
      - System Design: interview-preparation/system-design.md
      - Scenarios: interview-preparation/scenarios.md

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - search.highlight
    - toc.follow

plugins:
  - search
  - mermaid2
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence.fence_mermaid_custom

extra:
  version:
    provider: mike
