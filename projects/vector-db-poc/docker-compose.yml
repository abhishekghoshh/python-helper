name: vector-db-poc

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vector-db-api
    ports:
      - "9000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: vector-db-qdrant
    ports:
      - "9333:6333"
      - "9334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
      - ./qdrant.yaml:/config/qdrant.yaml:ro
    restart: unless-stopped

  docs:
    build:
      context: .
      dockerfile: Dockerfile.docs
    container_name: vector-db-docs
    ports:
      - "9001:8000"
    volumes:
      - ./docs:/app/docs
      - ./mkdocs.yml:/app/mkdocs.yml:ro
    command: mkdocs serve --dev-addr 0.0.0.0:8000
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: vector-db-streamlit
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    env_file:
      - .env
    depends_on:
      - api
    restart: unless-stopped

volumes:
  qdrant_storage:
