services:
  # 1. The Redis Message Broker
  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - worker-network

  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: redis-insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/db
    networks:
      - worker-network
    depends_on:
      - redis


  # 2. The FastAPI Application (Web Server)
  prime-calculator-api:
    container_name: prime-calculator-api
    image: abhishek1009/prime-calculator-api:latest
    build: .
    volumes:
      - ./src:/src
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - worker-network

  # 3. The Celery Worker
  prime-calculator-worker:
    container_name: prime-calculator-worker
    image: abhishek1009/prime-calculator-worker:latest
    build: .
    command: etc/worker/run.sh
    volumes:
      - ./src:/src
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - worker-network
  sonardb:
    image: postgres:15
    container_name: prime_app_sonardb
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonarqube
    volumes:
      - sonardb_data:/var/lib/postgresql/data
    networks:
      - worker-network
    
  # 5. SonarQube Server
  sonarqube:
    image: sonarqube:latest
    container_name: prime_app_sonarqube
    ports:
      - "9000:9000" # SonarQube UI
    depends_on:
      - sonardb
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonardb:5432/sonarqube
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    volumes:
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck: # <-- NEW: Waits for SonarQube to be fully ready
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/system/status"]
      interval: 15s
      timeout: 10s
      retries: 30
    networks:
      - worker-network

  # 6. NEW: The SonarQube Scanner Service
  # This is a one-off "task" container, not a long-running service.
  sonar-scanner:
    image: sonarsource/sonar-scanner-cli
    container_name: prime_app_scanner
    volumes:
      - .:/usr/src:ro  # Mount your code to be scanned
      - trivy-reports:/reports:rw # Shared volume for reports
      - sonar_scanner:/sonar-scanner-data # Persistent data for Sonar Scanner
    depends_on:
      sonarqube: # <-- NEW: Waits for the healthcheck to pass
        condition: service_healthy
      trivy-scanner:
        condition: service_started
    environment:
      - SONAR_HOST_URL=http://sonarqube:9000
      - SONAR_TOKEN=${SONAR_LOGIN_TOKEN} # <-- NEW: Reads from .env file
      - SONAR_PROJECT_KEY=${SONAR_PROJECT_KEY}
      - PROJECT_DIR=/usr/src
      - WORKING_DIR=/sonar-scanner-data
    user: root
    working_dir: /sonar-scanner-data
    command: sh /usr/src/etc/sonar/scan.sh
    networks:
      - worker-network
  trivy-scanner:
    image: alpine:latest
    container_name: prime_app_trivy
    ports:
      - "8080:80" # Expose Nginx on port 8080
    volumes:
      # Mount the Docker socket to let Trivy scan host images
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount your project's code for Helm/config scanning
      - .:/usr/src
      - trivy-reports:/reports # Shared volume for reports
    environment:
      - SONAR_HOST_URL=http://sonarqube:9000
      - SONAR_TOKEN=${SONAR_LOGIN_TOKEN} # <-- NEW: Reads from .env file
      - SONAR_PROJECT_KEY=${SONAR_PROJECT_KEY}
      - TRIVY_VERSION=0.67.2
      - DOCKER_IMAGE_NAME=abhishek1009/prime-calculator-api:latest
      - PROJECT_DIR=/usr/src
      - WORKING_DIR=/reports
      - HELM_CHART_PATH=/usr/src/helm
    working_dir: /reports
    command: sh /usr/src/etc/trivy/scan.sh
    networks:
      - worker-network

volumes:
  redis-data:
    driver: local
  redisinsight-data:
    driver: local
  sonardb_data:
    driver: local
  sonarqube_extensions: 
    driver: local
  sonarqube_logs: 
    driver: local
  sonar_scanner:
    driver: local
  trivy-reports:
    driver: local

networks:
  worker-network:
    driver: bridge