apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.redis.pvc.name }}
  labels:
    {{- include "prime-api.labels" . | nindent 4 }}
spec:
  storageClassName: {{ .Values.redis.pvc.storageClassName }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.redis.pvc.storage }}