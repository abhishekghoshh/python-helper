apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.redis.pv.name }}
  labels:
    type: local
    {{- include "prime-api.labels" . | nindent 4 }}
spec:
  storageClassName: {{ .Values.redis.pvc.storageClassName }}
  capacity:
    storage: {{ .Values.redis.pv.storage }}
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: {{ .Values.redis.pv.hostPath }}